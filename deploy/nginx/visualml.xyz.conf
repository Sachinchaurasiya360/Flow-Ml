# Host-level Nginx (runs on the EC2 instance, NOT in Docker).
# Reverse-proxies the public frontend domain to the client container.
# Certbot will rewrite this file to add the HTTPS server block + HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name visualml.xyz www.visualml.xyz;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
