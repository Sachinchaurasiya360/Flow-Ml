name: flow-ml

services:
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.visualml.xyz}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: flow-ml-client
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build: ./server
    container_name: flow-ml-server
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flow-ml-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
